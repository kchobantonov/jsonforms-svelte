packages:
  - 'packages/*'
  - 'apps/*'
  - 'tests'

allowBuilds:
  '@hugeicons/svelte': true
  esbuild: true

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
  ajv-formats: ^3.0.1
  jiti: 2.6.1
  lightningcss: 1.30.2

catalog:
  '@jsonforms/core': '^3.9.0-alpha.1'
  '@jsonforms/examples': '^3.9.0-alpha.1'
  'vite': npm:@voidzero-dev/vite-plus-core@1.4.0
  'vitest': 5.0.5
  '@vitest/browser-playwright': 5.0.5
  '@vitest/coverage-v8': 5.0.5
  '@sveltejs/vite-plugin-svelte': '7.3.1'
  '@sveltejs/kit': '2.69.3'
  'vitest-browser-svelte': '3.1.0'
  '@tailwindcss/vite': '4.3.3'
  'tailwindcss': '4.3.3'
  'vite-plugin-static-copy': '4.1.1'
  vite-plus: 1.4.0
onlyBuiltDependencies:
  - esbuild
  - '@tailwindcss/oxide'
  - playwright
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
