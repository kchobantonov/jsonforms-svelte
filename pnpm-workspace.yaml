packages:
  - 'packages/*'
  - 'apps/*'
  - 'tests'

allowBuilds:
  '@hugeicons/svelte': true
  esbuild: true

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
  ajv-formats: ^3.0.1
  jiti: 2.6.1
  lightningcss: 1.30.2

catalog:
  '@chobantonov/jsonforms-extended-spec': '0.2.0'
  '@internationalized/date': '^3.12.0'
  '@jsonforms/core': '^3.9.0-alpha.4'
  '@jsonforms/examples': '^3.9.0-alpha.4'
  '@lucide/svelte': '^0.542.0'
  '@skeletonlabs/skeleton': '^4.12.1'
  '@skeletonlabs/skeleton-svelte': '^4.12.1'
  '@sveltejs/adapter-auto': '^7.0.0'
  '@sveltejs/adapter-static': '^3.0.10'
  '@sveltejs/package': '^2.5.7'
  '@tailwindcss/forms': '^0.5.11'
  '@types/culori': '^4.0.1'
  '@types/lodash': '^4.14.172'
  '@types/node': '^22'
  'ag-grid-community': '^36.0.1'
  'ajv': '^8.20.0'
  'ajv-errors': '^3.0.0'
  'ajv-formats': '^3.0.1'
  'ajv-i18n': '^4.2.0'
  'ajv-keywords': '^5.1.0'
  'bits-ui': '^2.20.0'
  'clsx': '^2.1.1'
  'culori': '^4.0.2'
  'dayjs': '^1.10.6'
  'flowbite': '^4.0.1'
  'flowbite-svelte': '^1.33.1'
  'flowbite-svelte-icons': '^3.1.0'
  'maska': '^3.2.0'
  'monaco-editor': '^0.55.1'
  'paneforge': '^1.0.2'
  'publint': '^0.3.17'
  'runed': '0.35.1'
  'shadcn-svelte': '^1.8.2'
  'svelte': '^5.49.2'
  'svelte-check': '^4.7.8'
  'svelte-toolbelt': '0.10.6'
  'tailwind-variants': '^3.3.0'
  'tw-animate-css': '^1.4.0'
  'typescript': '~6.0.3'
  'vite': npm:@voidzero-dev/vite-plus-core@1.4.0
  'vitest': 5.0.5
  '@vitest/browser-playwright': 5.0.5
  '@vitest/coverage-v8': 5.0.5
  '@sveltejs/vite-plugin-svelte': '7.3.1'
  '@sveltejs/kit': '2.69.3'
  'vitest-browser-svelte': '3.1.0'
  '@tailwindcss/vite': '4.3.3'
  'tailwindcss': '4.3.3'
  'vite-plugin-static-copy': '4.1.1'
  vite-plus: 1.4.0
# Peer ranges express the minimum supported version; local dev versions can be newer.
catalogs:
  peers:
    '@hugeicons/core-free-icons': '^4.2.2'
    '@hugeicons/svelte': '^1.1.4'
    '@sveltejs/kit': '^2.0.0'
    '@tabler/icons-svelte': '^3.44.0'
    flowbite-svelte: '^1.31.0'
    lodash: '^4.17.21'
    phosphor-svelte: '^3.1.0'
    ractive: '^1.4.4'
    remixicon-svelte: '^0.0.5'
    svelte: '^5.49.2'
    tailwind-merge: '^3.4.0'
onlyBuiltDependencies:
  - esbuild
  - '@tailwindcss/oxide'
  - playwright
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
